<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#A87182">
<title>Glamoora — Beauty Services Marketplace</title>
<style>
:root{
  --brand:#A87182; --brand-600:#96626F; --brand-700:#7E4F5C; --brand-800:#5F3A46;
  --brand-100:#F2E4E7; --brand-50:#FAF3F5; --brand-05:#FDFAFB;
  --ink:#332227; --ink-2:#5C464C; --ink-3:#93797F;
  --line:#F0E1E4; --line-2:#E5D2D6;
  --cream:#FFFFFF; --gold:#B98A3E; --gold-bg:#F7EEDD;
  --green:#3E7C59; --green-bg:#E4F0E9;
  --amber:#A9761F; --amber-bg:#F9EFDC;
  --red:#B04A4A; --red-bg:#F7E4E4;
  --plum:#4A3238;
  --serif:Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --sh:0 1px 2px rgba(51,34,39,.05),0 10px 30px -12px rgba(51,34,39,.14);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--sans);background:linear-gradient(160deg,#C99AA5,#B5808F 40%,#96626F);color:var(--ink);font-size:14.5px;line-height:1.5}
#app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--brand-05);position:relative;box-shadow:0 0 70px rgba(40,20,26,.35)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.serif{font-family:var(--serif)}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(253,250,251,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .brand{display:flex;align-items:center;gap:8px}
.topbar .brand img{height:30px;width:auto}
.topbar .brand span{font-family:var(--serif);letter-spacing:.22em;font-size:13.5px;color:var(--plum);font-weight:600}
.topbar .grow{flex:1}
.tbtn{position:relative;display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--brand-50);color:var(--plum)}
.tbtn:active{background:var(--brand-100)}
.tbtn .bdg{position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--brand);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--brand-05)}
.tb-title{font-family:var(--serif);font-size:16px;color:var(--plum);letter-spacing:.02em}
.tb-sub{font-size:11px;color:var(--ink-3)}

/* ---------- layout ---------- */
.main{padding:16px 16px 100px;min-height:calc(100dvh - 180px)}
.sect{margin-top:22px}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.sect-h h3{font-family:var(--serif);font-size:16.5px;color:var(--plum);font-weight:600;letter-spacing:.01em}
.sect-h button{font-size:12.5px;color:var(--brand-700);font-weight:600}
.greet{font-family:var(--serif);font-size:21px;color:var(--plum);margin-top:2px}
.greet small{display:block;font-family:var(--sans);font-size:12.5px;color:var(--ink-3);margin-top:2px;font-weight:400}

/* ---------- bottom nav ---------- */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:60;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2.5px;padding:5px 0 2px;color:var(--ink-3);font-size:10px;font-weight:600;letter-spacing:.02em;position:relative}
.bnav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bnav button.active{color:var(--plum)}
.bnav button.active svg{stroke:var(--brand-700);stroke-width:1.9}
.bnav button.active::after{content:'';position:absolute;top:-7px;width:22px;height:3px;border-radius:0 0 4px 4px;background:var(--brand)}

/* ---------- cards / chips ---------- */
.card{background:var(--cream);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:14px}
.card.flush{padding:0;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;background:var(--brand-50);border:1px solid var(--brand-100);color:var(--brand-800);font-size:12px;font-weight:600}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.mono{background:#fff;border-color:var(--line-2);color:var(--ink-2);font-weight:500}
.chip.rem{cursor:pointer}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.stars{color:var(--gold);letter-spacing:1px;font-size:12px}
.stars .dim{color:var(--line-2)}
.muted{color:var(--ink-3);font-size:12px}
.small{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3.5px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em}
.pill.pending{background:var(--amber-bg);color:var(--amber)}
.pill.confirmed{background:var(--green-bg);color:var(--green)}
.pill.rejected,.pill.no_show{background:var(--red-bg);color:var(--red)}
.pill.cancelled{background:#EFE9EA;color:var(--ink-3)}
.pill.completed{background:var(--plum);color:#fff}
.pill.verified{background:var(--green-bg);color:var(--green)}
.pill.unverified{background:#EFE9EA;color:var(--ink-3)}
.pill.pv{background:var(--amber-bg);color:var(--amber)}
.pill.suspended{background:var(--red-bg);color:var(--red)}

/* ---------- buttons / forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 18px;border-radius:13px;font-weight:700;font-size:14px;transition:transform .06s ease}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--plum);color:#fff}
.btn-p:hover{background:#3A252B}
.btn-b{background:var(--brand);color:#fff}
.btn-o{background:#fff;border:1.5px solid var(--line-2);color:var(--plum)}
.btn-o:hover{border-color:var(--brand);color:var(--brand-700)}
.btn-d{background:var(--red-bg);color:var(--red)}
.btn.sm{padding:8px 13px;font-size:12.5px;border-radius:10px}
.btn.xs{padding:5px 10px;font-size:11.5px;border-radius:8px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.f{margin-bottom:12px}
.f label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.inp,select.inp,textarea.inp{width:100%;padding:11px 13px;border:1.5px solid var(--line-2);border-radius:12px;background:#fff;font-size:14.5px;outline:none}
.inp:focus{border-color:var(--brand)}
textarea.inp{resize:vertical;min-height:74px}
.inp.err{border-color:var(--red)}
.ferr{color:var(--red);font-size:12.5px;margin:-4px 0 10px;display:none}
.errbox{background:var(--red-bg);color:var(--red);font-size:13px;border-radius:10px;padding:9px 12px;margin-bottom:12px;display:none}
.seg{display:flex;background:var(--brand-100);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-weight:700;font-size:13px;color:var(--ink-2)}
.seg button.on{background:#fff;color:var(--plum);box-shadow:0 1px 4px rgba(51,34,39,.12)}

/* ---------- search ---------- */
.searchbar{display:flex;gap:8px}
.searchbar .wrap{flex:1;position:relative}
.searchbar .wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--ink-3);fill:none;stroke-width:1.8;stroke-linecap:round}
.searchbar input{width:100%;padding:12px 13px 12px 38px;border:1.5px solid var(--line-2);border-radius:13px;background:#fff;font-size:14.5px;outline:none}
.searchbar input:focus{border-color:var(--brand)}

/* ---------- provider cards ---------- */
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 12px;scroll-snap-type:x mandatory;margin:0 -16px;padding-left:16px;padding-right:16px}
.hscroll>*{scroll-snap-align:start;flex:0 0 252px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:13px;display:flex;flex-direction:column;gap:8px}
.pcard .top{display:flex;gap:10px;align-items:center}
.avatar{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:.03em;flex:none}
.pcard h4{font-size:14.5px;color:var(--plum);display:flex;align-items:center;gap:5px}
.pcard h4 svg{width:15px;height:15px;stroke:var(--green);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pcard .meta{font-size:12px;color:var(--ink-3)}
.pcard .tags{display:flex;gap:5px;flex-wrap:wrap}
.pcard .foot{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
.from{font-weight:800;color:var(--brand-700);font-size:14px}
.from small{font-weight:500;color:var(--ink-3);font-size:11px}
.favb{position:relative;width:34px;height:34px;border-radius:10px;background:var(--brand-50);display:grid;place-items:center}
.favb svg{width:17px;height:17px;stroke:var(--brand-700);fill:none;stroke-width:1.8}
.favb.on svg{fill:var(--brand);stroke:var(--brand)}
.heartb{width:38px;height:38px;border-radius:12px;background:#fff;border:1.5px solid var(--line-2);display:grid;place-items:center}
.heartb svg{width:18px;height:18px;stroke:var(--brand-700);fill:none;stroke-width:1.8}
.heartb.on{background:var(--brand-50);border-color:var(--brand-100)}
.heartb.on svg{fill:var(--brand);stroke:var(--brand)}

/* ---------- categories ---------- */
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.cat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;box-shadow:0 1px 3px rgba(51,34,39,.05)}
.cat .ic{width:44px;height:44px;border-radius:13px;background:linear-gradient(150deg,var(--brand-100),var(--brand-50));display:grid;place-items:center;font-size:21px}
.cat b{font-size:11px;color:var(--plum);line-height:1.25;font-weight:700}
.cat small{font-size:9.5px;color:var(--ink-3);font-weight:600}

/* ---------- portfolio tiles ---------- */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;aspect-ratio:4/4.6;border-radius:14px;overflow:hidden;display:grid;place-items:center}
.tile svg{width:46%;height:46%;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.95}
.tile .cap{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(40,22,27,.55);backdrop-filter:blur(4px);color:#fff;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:8px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g1{background:linear-gradient(150deg,#A87182,#7E4F5C)}
.g2{background:linear-gradient(150deg,#C99AA5,#96626F)}
.g3{background:linear-gradient(150deg,#8A5A66,#5F3A46)}
.g4{background:linear-gradient(150deg,#B98A3E,#8A6524)}
.g5{background:linear-gradient(150deg,#6E5A63,#46363E)}
.g6{background:linear-gradient(150deg,#C4A0AB,#A87182 70%,#7E4F5C)}

/* ---------- service list ---------- */
.svc{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.svc:last-child{border-bottom:0}
.svc .info{flex:1;min-width:0}
.svc h4{font-size:14px;color:var(--plum);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.svc p{font-size:12px;color:var(--ink-3);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.svc .price{text-align:right;flex:none}
.svc .price b{display:block;font-size:14.5px;color:var(--brand-700)}
.svc .price small{font-size:11px;color:var(--ink-3)}
.loc-type{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--ink-2);background:var(--brand-50);padding:2.5px 8px;border-radius:999px;margin-top:4px}
.loc-type svg{width:11px;height:11px;stroke:var(--brand-700);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- booking flow ---------- */
.steps{display:flex;gap:6px;margin-bottom:16px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line-2)}
.steps i.on{background:var(--brand)}
.daychips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -16px;padding-left:16px;padding-right:16px}
.dchip{flex:none;width:64px;padding:9px 4px;border-radius:13px;border:1.5px solid var(--line-2);background:#fff;text-align:center}
.dchip small{display:block;font-size:10px;color:var(--ink-3);font-weight:600;text-transform:uppercase}
.dchip b{display:block;font-size:17px;color:var(--plum);margin:2px 0}
.dchip span{font-size:10px;color:var(--ink-3)}
.dchip.on{background:var(--plum);border-color:var(--plum)}
.dchip.on small,.dchip.on span{color:rgba(255,255,255,.75)}
.dchip.on b{color:#fff}
.dchip[disabled]{opacity:.4}
.slotgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{padding:10px 4px;border-radius:11px;border:1.5px solid var(--line-2);background:#fff;font-weight:700;font-size:13px;color:var(--plum)}
.slot.on{background:var(--brand);border-color:var(--brand);color:#fff}
.sumrow{display:flex;justify-content:space-between;padding:7px 0;font-size:13.5px}
.sumrow b{color:var(--plum)}
.sumrow .v{color:var(--ink-2);max-width:60%;text-align:right}
.total{display:flex;justify-content:space-between;align-items:center;border-top:1.5px dashed var(--line-2);margin-top:8px;padding-top:12px}
.total b{font-family:var(--serif);font-size:20px;color:var(--plum)}

/* ---------- bookings ---------- */
.bcard{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:13px;display:flex;flex-direction:column;gap:8px;margin-bottom:11px}
.bcard .top{display:flex;align-items:center;gap:10px}
.bcard .avatar{width:42px;height:42px;border-radius:12px;font-size:13px}
.bcard h4{font-size:14px;color:var(--plum)}
.bcard .sub{font-size:12px;color:var(--ink-3)}
.bcard .grid{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);background:var(--brand-05);border:1px solid var(--line);border-radius:11px;padding:8px 10px}
.bcard .grid span{display:flex;align-items:center;gap:5px}
.bcard .grid svg{width:13px;height:13px;stroke:var(--brand-700);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bcard .acts{display:flex;gap:7px}
.bcard .acts .btn{flex:1}
.empty{text-align:center;padding:44px 20px;color:var(--ink-3)}
.empty .big{font-size:40px;margin-bottom:10px}
.empty h4{font-family:var(--serif);color:var(--plum);font-size:16px;margin-bottom:4px}
.empty p{font-size:12.5px;max-width:260px;margin:0 auto 14px}

/* ---------- provider profile ---------- */
.pcover{height:130px;background:linear-gradient(150deg,#A87182,#5F3A46);border-radius:18px;position:relative;overflow:hidden}
.pcover .wm{position:absolute;right:-14px;bottom:-24px;opacity:.16;width:150px}
.phead{display:flex;flex-direction:column;align-items:center;margin-top:-46px;position:relative;z-index:2}
.phead .avatar{width:84px;height:84px;border-radius:26px;font-size:26px;border:4px solid var(--brand-05);box-shadow:var(--sh)}
.phead h2{font-family:var(--serif);font-size:20px;color:var(--plum);margin-top:9px;display:flex;align-items:center;gap:7px}
.phead .meta{font-size:12.5px;color:var(--ink-3);margin-top:3px;display:flex;align-items:center;gap:5px}
.ptabs{display:flex;gap:6px;margin:16px 0 12px;background:var(--brand-100);padding:4px;border-radius:12px}
.ptabs button{flex:1;padding:8px 2px;border-radius:9px;font-weight:700;font-size:12px;color:var(--ink-2)}
.ptabs button.on{background:#fff;color:var(--plum);box-shadow:0 1px 4px rgba(51,34,39,.12)}
.rsum{display:flex;align-items:center;gap:14px;background:var(--brand-50);border:1px solid var(--brand-100);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.rsum .n{font-family:var(--serif);font-size:30px;color:var(--plum)}
.rev{padding:11px 0;border-bottom:1px solid var(--line)}
.rev:last-child{border-bottom:0}
.rev .top{display:flex;align-items:center;gap:8px}
.rev .top .avatar{width:30px;height:30px;border-radius:10px;font-size:10.5px}
.rev .top b{font-size:13px;color:var(--plum)}
.rev .top .muted{margin-left:auto;font-size:11px}
.rev p{font-size:12.5px;color:var(--ink-2);margin-top:5px}
.hours-row{display:flex;align-items:center;justify-content:space-between;padding:9.5px 0;border-bottom:1px solid var(--line);font-size:13px}
.hours-row:last-child{border-bottom:0}
.hours-row b{color:var(--plum);width:92px}
.hours-row .w{color:var(--ink-2)}
.hours-row .s{font-size:11px;font-weight:700}
.s.ok{color:var(--green)} .s.no{color:var(--ink-3)} .s.low{color:var(--amber)}

/* ---------- dashboard stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 6px;text-align:center;box-shadow:0 1px 3px rgba(51,34,39,.05)}
.stat b{display:block;font-family:var(--serif);font-size:16.5px;color:var(--plum)}
.stat small{font-size:9.5px;color:var(--ink-3);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.checklist{display:flex;flex-direction:column;gap:8px}
.checklist li{display:flex;align-items:center;gap:9px;font-size:13px;list-style:none;color:var(--ink-2)}
.checklist .dot{width:20px;height:20px;border-radius:7px;display:grid;place-items:center;background:var(--green-bg);color:var(--green);flex:none}
.checklist .dot.no{background:var(--amber-bg);color:var(--amber)}
.checklist .dot svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.checklist li .sp{flex:1}

/* ---------- calendar ---------- */
.cal-day{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px}
.cal-day .h{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--brand-05);border-bottom:1px solid var(--line);font-weight:700;color:var(--plum);font-size:13px}
.cal-day .h.today{background:var(--brand);color:#fff}
.cal-day .h small{margin-left:auto;font-weight:600;font-size:11px;color:var(--ink-3)}
.cal-day .h.today small{color:rgba(255,255,255,.8)}
.crow{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12.5px}
.crow:last-child{border-bottom:0}
.crow .t{font-weight:800;color:var(--plum);width:44px;flex:none}
.crow .x{flex:1;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow.blocked{background:repeating-linear-gradient(45deg,#FBF3F0,#FBF3F0 6px,#F5E6E0 6px,#F5E6E0 12px);color:var(--ink-2)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink-3);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}

/* ---------- switch ---------- */
.sw{position:relative;width:42px;height:25px;flex:none;cursor:pointer}
.sw input{display:none}
.sw i{position:absolute;inset:0;background:var(--line-2);border-radius:999px;transition:background .15s}
.sw i::after{content:'';position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.sw input:checked+i{background:var(--green)}
.sw input:checked+i::after{transform:translateX(17px)}

/* ---------- list rows ---------- */
.lrow{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .ic{width:38px;height:38px;border-radius:12px;background:var(--brand-50);display:grid;place-items:center;flex:none}
.lrow .ic svg{width:18px;height:18px;stroke:var(--brand-700);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lrow .t{flex:1;min-width:0}
.lrow .t b{display:block;font-size:13.5px;color:var(--plum)}
.lrow .t span{font-size:11.5px;color:var(--ink-3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- admin tabs ---------- */
.atabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.atabs button{flex:none;padding:8px 13px;border-radius:999px;font-weight:700;font-size:12.5px;background:#fff;border:1.5px solid var(--line-2);color:var(--ink-2)}
.atabs button.on{background:var(--plum);border-color:var(--plum);color:#fff}

/* ---------- sheet / modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(40,22,27,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:var(--brand-05);border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto;animation:up .18s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet .h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet .h h3{font-family:var(--serif);font-size:17px;color:var(--plum)}
.sheet .h .x{width:32px;height:32px;border-radius:10px;background:var(--brand-100);display:grid;place-items:center}
.sheet .h .x svg{width:14px;height:14px;stroke:var(--plum);fill:none;stroke-width:2.2;stroke-linecap:round}
.sheet .grip{width:38px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 12px}

/* ---------- toast ---------- */
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--plum);color:#fff;padding:11px 18px;border-radius:13px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 8px 30px rgba(40,22,27,.35);max-width:90%;text-align:center;animation:up .15s ease}

/* ---------- auth / splash ---------- */
.auth-hero{background:linear-gradient(165deg,#A87182,#7E4F5C 75%,#5F3A46);padding:34px 24px 40px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;overflow:hidden}
.auth-hero img{height:150px;width:auto;filter:brightness(0) invert(1);opacity:.97}
.auth-hero .tag{margin-top:10px;color:rgba(255,255,255,.85);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.auth-body{padding:20px 18px 60px;margin-top:-18px;background:var(--brand-05);border-radius:22px 22px 0 0;min-height:calc(100dvh - 210px)}
.demo-row{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.demo-row .l{text-align:center;font-size:10.5px;color:var(--ink-3);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.demo{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px dashed var(--line-2);border-radius:13px;background:#fff;font-weight:600;font-size:13px;color:var(--plum)}
.demo .r{margin-left:auto;font-size:11px;color:var(--ink-3);font-weight:500}
.splash{min-height:100dvh;background:linear-gradient(165deg,#B5808F,#A87182 45%,#7E4F5C);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative}
.splash img{height:250px;width:auto;filter:brightness(0) invert(1)}
.splash .tag{color:rgba(255,255,255,.8);letter-spacing:.3em;font-size:12px;text-transform:uppercase;font-weight:600;margin-top:14px}
.splash .ld{margin-top:26px;display:flex;gap:6px}
.splash .ld i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.85);animation:bl 1.2s infinite}
.splash .ld i:nth-child(2){animation-delay:.2s}.splash .ld i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}

/* success */
.success{display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 10px 10px}
.success .ring{width:84px;height:84px;border-radius:50%;background:var(--green-bg);display:grid;place-items:center;margin-bottom:16px}
.success .ring svg{width:40px;height:40px;stroke:var(--green);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.success h2{font-family:var(--serif);font-size:21px;color:var(--plum)}
.success p{font-size:13px;color:var(--ink-3);margin-top:6px;max-width:280px}
.reftag{margin-top:14px;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--brand-700);background:var(--brand-50);border:1px dashed var(--brand-100);padding:6px 14px;border-radius:999px}

/* star picker */
.starpick{display:flex;justify-content:center;gap:10px;margin:14px 0}
.starpick button{width:44px;height:44px}
.starpick svg{width:40px;height:40px;fill:var(--line-2);stroke:var(--line-2);stroke-width:1}
.starpick button.on svg{fill:var(--gold);stroke:var(--gold)}
.notif{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.notif .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--brand-50)}
.notif .ic svg{width:17px;height:17px;stroke:var(--brand-700);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.notif.new .ic{background:var(--brand);}.notif.new .ic svg{stroke:#fff}
.notif .t{flex:1}
.notif .t b{font-size:13px;color:var(--plum);display:block}
.notif .t span{font-size:12px;color:var(--ink-2);display:block;margin-top:1px}
.notif .muted{font-size:10.5px;margin-top:3px}
.notif.new .dot{width:8px;height:8px;border-radius:50%;background:var(--brand);margin-top:6px;flex:none}
.divider{height:1px;background:var(--line);margin:14px 0}
.note{font-size:11.5px;color:var(--ink-3);background:var(--brand-50);border:1px solid var(--brand-100);border-radius:10px;padding:9px 11px;margin-top:10px}
</style>
</head>

function $(s){return document.querySelector(s)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(p){return (p||'id')+'_'+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4)}
const pad=n=>String(n).padStart(2,'0');
function dISO(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayISO(){return dISO(new Date())}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function parseISO(s){const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)}
function timeToMin(t){const[h,m]=t.split(':').map(Number);return h*60+m}
function minToTime(m){return pad(Math.floor(m/60))+':'+pad(m%60)}
function addMin(t,n){return minToTime(timeToMin(t)+n)}
function overlap(aS,aE,bS,bE){return aS<bE&&bS<aE}
function haversine(aLat,aLng,bLat,bLng){const R=6371,dLa=(bLat-aLat)*Math.PI/180,dLo=(bLng-aLng)*Math.PI/180;const s=Math.sin(dLa/2)**2+Math.cos(aLat*Math.PI/180)*Math.cos(bLat*Math.PI/180)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(s))}
function fmtRM(n){return 'RM'+Number(n).toLocaleString('en-MY',{maximumFractionDigits:2})}
function fmtDate(iso){return parseISO(iso).toLocaleDateString('en-MY',{weekday:'short',day:'numeric',month:'short'})}
function fmtDateLong(iso){return parseISO(iso).toLocaleDateString('en-MY',{weekday:'long',day:'numeric',month:'long'})}
function timeAgo(ts){const s=Math.max(1,Math.floor((Date.now()-ts)/1000));if(s<60)return'just now';const m=Math.floor(s/60);if(m<60)return m+'m ago';const h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago'}
function hashNum(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
const AV_GRADS=['g1','g2','g3','g4','g5','g6'];
function avGrad(name){return AV_GRADS[hashNum(name)%AV_GRADS.length]}
function initials(name){return name.split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()}

function nextWorkDayOffset(pid,from){

  for(let i=from;i<14;i++){const d=addDays(new Date(),i);if(av[d.getDay()])return i}
  return from;
}

const unreadCount=userId=>db.notifs.filter(n=>n.userId===userId&&!n.read).length;
const customerName=id=>{const u=userById(id);return u?u.name.split(' ')[0]:'Guest'};
const minPrice=pid=>{const s=activeServicesOf(pid);return s.length?Math.min(...s.map(x=>x.price)):0};

/* availability helpers */
function availMap(pid){
  const m={};
  db.availability.filter(a=>a.providerId===pid&&a.active).forEach(a=>{if(!m[a.day]||timeToMin(a.start)<timeToMin(m[a.day].start))m[a.day]={start:a.start,end:a.end}});
  return m;
}
function breaksOf(pid,day){return db.breaks.filter(b=>b.providerId===pid&&b.day===day)}

/* ================= SLOT ENGINE (pure) ================= */
function slotsForDate(window, breaksDay, blockedDay, busyDay, duration, dateStr){
  if(!window)return[];
  const s0=timeToMin(window.start),e0=timeToMin(window.end),now=new Date(),t0=todayISO();
  const nowMin=(now.getHours()*60+now.getMinutes());
  const out=[];
  for(let t=s0;t+duration<=e0;t+=30){
    const s=t,e=t+duration;
    if(dateStr===t0&&s<nowMin+15)continue;
    let bad=false;
    for(const b of breaksDay)if(overlap(s,e,timeToMin(b.start),timeToMin(b.end))){bad=true;break}
    if(!bad)for(const b of blockedDay)if(overlap(s,e,timeToMin(b.start),timeToMin(b.end))){bad=true;break}
    if(!bad)for(const b of busyDay)if(overlap(s,e,b.s,b.e)){bad=true;break}
    if(!bad)out.push(minToTime(s));
  }
  return out;
}
function providerSlots(pid,serviceId,dateStr){
  const svc=serviceOf(serviceId);if(!svc)return[];
  const am=availMap(pid);
  const w=am[parseISO(dateStr).getDay()];
  if(!w)return[];
  const br=breaksOf(pid,parseISO(dateStr).getDay());
  const blocked=db.blocked.filter(b=>b.providerId===pid&&b.start.slice(0,10)===dateStr).map(b=>({start:b.start.slice(11,16),end:b.end.slice(11,16)}));
  const busy=db.bookings.filter(b=>b.providerId===pid&&b.date===dateStr&&!['cancelled','rejected'].includes(b.status)).map(b=>({s:timeToMin(b.start),e:timeToMin(b.end)}));
  return slotsForDate(w,br,blocked,busy,svc.duration,dateStr);
}
function wouldConflict(pid,dateStr,start,end){
  return db.bookings.some(b=>b.providerId===pid&&b.date===dateStr&&!['cancelled','rejected'].includes(b.status)&&overlap(timeToMin(start),timeToMin(end),timeToMin(b.start),timeToMin(b.end)));
}

/* ================= ACTIONS / NOTIFS ================= */
function notify(userId,type,title,msg){db.notifs.unshift({id:uid('n'),userId,type,title,msg,read:false,createdAt:Date.now()});saveDB()}
function toast(msg){ui.toast={msg,id:Date.now()};render();setTimeout(()=>{if(ui.toast&&ui.toast.msg===msg){ui.toast=null;render()}},2400)}
function recomputeRating(pid){
  const rs=reviewsOf(pid);const p=profileOf(pid);
  if(rs.length){const base=(p.avg*(p.reviewCount||0));const total=base+rs.reduce((a,r)=>a+r.rating,0);const count=(p.reviewCount||0)+rs.length;p.avg=Math.round(total/count*10)/10;p.reviewCount=count}
  saveDB();
}
function setBookingStatus(bid,byUser,action){
  const b=db.bookings.find(x=>x.id===bid);if(!b)return false;
  const p=profileOf(b.providerId);const cu=userById(b.customerId);
  const svc=serviceOf(b.serviceId);
  const T={
    accept:['pending','confirmed'],reject:['pending','rejected'],cancel:['pending','cancelled'],
    complete:['confirmed','completed'],noshow:['confirmed','no_show']
  }[action];
  if(!T||b.status!==T[0])return false;
  b.status=T[1];b.updatedAt=Date.now();
  const loc=svc?svc.name:'';
  if(action==='accept')notify(b.customerId,'booking_confirmed','Booking confirmed',p.displayName+' confirmed your '+loc+' on '+fmtDate(b.date)+' at '+b.start+'.');
  if(action==='reject')notify(b.customerId,'booking_rejected','Booking declined',p.displayName+' is unable to take your '+loc+' on '+fmtDate(b.date)+'.');
  if(action==='cancel'){notify(b.customerId,'booking_cancelled','Booking cancelled','Your '+loc+' on '+fmtDate(b.date)+' was cancelled.');if(byUser)notify(b.providerId,'booking_cancelled','Booking cancelled',(cu?cu.name:'A customer')+' cancelled the '+loc+' on '+fmtDate(b.date)+'.')}
  if(action==='complete')notify(b.customerId,'booking_completed','Booking completed',loc+' with '+p.displayName+' is complete. We would love your review!');
  if(action==='noshow')notify(b.customerId,'booking_cancelled','Appointment missed',loc+' on '+fmtDate(b.date)+' was marked as no-show.');
  saveDB();return true;
}
function createBooking(cuId,svcId,dateStr,start){
  const s=serviceOf(svcId);if(!s)return{err:'Service not found'};
  if(start){const end=addMin(start,s.duration);if(wouldConflict(s.providerId,dateStr,start,end))return{err:'This slot was just taken. Please pick another time.'}}
  const u=userById(cuId);const p=profileOf(s.providerId);
  const b={id:uid('bkg'),ref:'GLM-'+Math.random().toString(36).slice(2,7).toUpperCase(),customerId:cuId,providerId:s.providerId,serviceId:svcId,date:dateStr,start:start||null,end:start?addMin(start,s.duration):null,price:s.price,locType:s.locationType,location:'',notes:'',status:start?'pending':'draft',payment:'Pay after service',createdAt:Date.now(),updatedAt:Date.now()};
  if(!start)return{draft:b};
  b.location=s.locationType==='provider'?p.addr:(u.area||'Customer location');
  db.bookings.push(b);
  notify(s.providerId,'booking_new','New booking request',(u?u.name:'A customer')+' requested '+s.name+' on '+fmtDate(dateStr)+' at '+start+'.');
  saveDB();return{booking:b};
}
function addReview(bid,rating,comment){
  const b=db.bookings.find(x=>x.id===bid);if(!b)return{err:'Booking not found'};
  if(b.status!=='completed')return{err:'Only completed bookings can be reviewed'};
  if(db.reviews.some(r=>r.bookingId===bid))return{err:'You already reviewed this booking'};
  const r={id:uid('r'),bookingId:bid,customerId:b.customerId,providerId:b.providerId,rating,comment:comment||'',image:null,createdAt:Date.now()};
  db.reviews.push(r);
  const p=profileOf(b.providerId);
  const base=p.avg*(p.reviewCount||0);
  p.avg=Math.round((base+r.rating)/(p.reviewCount+1)*10)/10;
  p.reviewCount+=1;
  notify(b.providerId,'review','New review ★ '+r.rating,customerName(b.customerId)+' left you a '+r.rating+'-star review.');
  saveDB();return{review:r};
}

function sortProviders(list){
  const d=ui.discover||{};const u=me();
  const scored=list.map(p=>{
    const dist=u?haversine(u.lat,u.lng,p.lat,p.lng):0;
    let score=(p.verification==='verified'?2:0)+p.avg*2-dist/8;
    return{p,dist,score};
  });
  switch(d.sort){
    case 'distance':scored.sort((a,b)=>a.dist-b.dist);break;
    case 'rating':scored.sort((a,b)=>b.p.avg-a.p.avg||b.p.reviewCount-a.p.reviewCount);break;
    case 'price_asc':scored.sort((a,b)=>minPrice(a.p.id)-minPrice(b.p.id));break;
    case 'price_desc':scored.sort((a,b)=>minPrice(b.p.id)-minPrice(a.p.id));break;
    default:scored.sort((a,b)=>b.score-a.score);
  }
  return scored;
}
function discoverState(){
  return ui.discover||{q:'',cat:'',maxPrice:0,minRating:0,maxDist:0,type:'',openToday:false,sort:'recommended'};
}
function filteredProviders(){
  const d=discoverState();const u=me();
  const q=(d.q||'').toLowerCase();
  let list=db.profiles.filter(p=>p.verification!=='suspended');
  if(q){
    list=list.filter(p=>{
      const s=servicesOf(p.id).map(x=>x.name.toLowerCase());
      const c=p.categoryIds.map(id=>(catOf(id)||{}).name||'').join(' ').toLowerCase();
      return p.displayName.toLowerCase().includes(q)||p.bio.toLowerCase().includes(q)||c.includes(q)||s.some(n=>n.includes(q));
    });
  }
  if(d.cat)list=list.filter(p=>p.categoryIds.includes(d.cat));
  if(d.maxPrice)list=list.filter(p=>{const m=minPrice(p.id);return m&&m<=d.maxPrice});
  if(d.minRating)list=list.filter(p=>p.avg>=d.minRating);
  if(d.maxDist&&u)list=list.filter(p=>haversine(u.lat,u.lng,p.lat,p.lng)<=d.maxDist);
  if(d.type==='provider')list=list.filter(p=>servicesOf(p.id).some(s=>s.locationType!=='customer'));
  if(d.type==='customer')list=list.filter(p=>servicesOf(p.id).some(s=>s.locationType!=='provider'));
  if(d.openToday){
    const t=todayISO();
    list=list.filter(p=>servicesOf(p.id).some(s=>providerSlots(p.id,s.id,t).length>0));
  }
  return list;
}

  const svcs=servicesOf(pid).filter(s=>s.active);
  const port=db.portfolio.filter(x=>x.providerId===pid);

  const am=availMap(pid);
  const fav=u&&isFav(u.id,pid);

  const svcTab='<div>'+svcs.map(s=>'<div class="svc"><div class="info"><h4>'+esc(s.name)+'</h4><p>'+esc(s.desc)+'</p>'+locTypeBadge(s.locationType)+'</div><div class="price"><b>'+fmtRM(s.price)+'</b><small>'+s.duration+' min</small></div><button class="btn btn-p sm" data-act="book" data-id="'+pid+'" data-svc="'+s.id+'" '+(suspended?'disabled':'')+'>Book</button></div>').join('')+(svcs.length?'':'<div class="empty"><h4>No services yet</h4><p>This professional hasn listed services.</p></div>')+'</div>';

  const revTab='<div class="rsum"><div class="n">'+prof.avg.toFixed(1)+'</div><div>'+starStr(Math.round(prof.avg))+'<div class="muted">'+prof.reviewCount+' reviews</div></div></div><div>'+revs.map(r=>'<div class="rev"><div class="top">'+avatarHTML(userById(r.customerId)?.name||'Guest',30)+'<b>'+esc((userById(r.customerId)?.name||'Guest').split(' ')[0])+'</b>'+starStr(r.rating)+'<span class="muted">'+timeAgo(r.createdAt)+'</span></div>'+(r.comment?'<p>'+esc(r.comment)+'</p>':'')+'</div>').join('')+(revs.length?'':'<div class="empty"><h4>No reviews yet</h4></div>')+'</div>';

    return '<div class="hours-row"><b>'+name+'</b><span class="w">'+w.start+'–'+w.end+'</span><span class="s '+cls+'">'+txt+'</span></div>';
  }).join('')+'</div>';

  +'<div class="pcover"><img class="wm" src="'+LOGO_MARK+'" alt=""></div>'
  +'<div class="phead">'+avatarHTML(prof.displayName,84)
  +'<h2>'+esc(prof.displayName)+(prof.verification==='verified'?'<span class="pill verified">'+ic('shield',12)+'Verified</span>':prof.verification==='pending'?'<span class="pill pv">Verification pending</span>':'')+'</h2>'
  +'<div class="meta" style="display:flex;gap:6px;align-items:center">'+starStr(Math.round(prof.avg))+'<b style="color:var(--plum)">'+prof.avg.toFixed(1)+'</b>('+prof.reviewCount+') · '+dist.toFixed(1)+' km away</div>'
  +'<div class="row" style="margin-top:8px;gap:6px;flex-wrap:wrap">'+prof.categoryIds.map(id=>{const c=catOf(id);return c?'<span class="chip">'+c.icon+' '+esc(c.name)+'</span>':''}).join('')+'</div>'
  +'<div class="row" style="margin-top:12px;gap:8px">'

}

/* ================= BOOKING FLOW ================= */
function screenBook(p){
  const pid=p.id;const prof=profileOf(pid);if(!prof)return screenHome();
  const u=me();
  const b=ui.booking||(ui.booking={providerId:pid,serviceId:p.svc||activeServicesOf(pid)[0]?.id||null,date:null,start:null,notes:'',loc:null});
  if(b.providerId!==pid){b.providerId=pid;b.date=null;b.start=null}
  if(!b.serviceId)b.serviceId=activeServicesOf(pid)[0]?.id||null;
  const svc=serviceOf(b.serviceId);
  const days=Array.from({length:14},(_,i)=>addDays(new Date(),i));
  const dayChips=days.map(d=>{
    const iso=dISO(d);const am=availMap(pid);const off=!am[d.getDay()];
    return '<button class="dchip'+(b.date===iso?' on':'')+'" data-act="pickdate" data-v="'+iso+'" '+(off?'disabled':'')+'><small>'+parseISO(iso).toLocaleDateString('en-MY',{weekday:'short'})+'</small><b>'+d.getDate()+'</b><span>'+parseISO(iso).toLocaleDateString('en-MY',{month:'short'})+'</span></button>';
  }).join('');
  let slotsHtml='';
  if(b.date&&svc){
    const slots=providerSlots(pid,svc.id,b.date);
    slotsHtml=slots.length
     ? '<div class="slotgrid">'+slots.map(t=>'<button class="slot'+(b.start===t?' on':'')+'" data-act="pickslot" data-v="'+t+'">'+t+'</button>').join('')+'</div>'
     : '<div class="empty" style="padding:26px 10px"><h4>No slots on this day</h4><p>Fully booked or unavailable. Try another day.</p></div>';
  }
  const locBlock = b.date&&b.start&&svc ? (
    svc.locationType==='provider'
     ? '<div class="sumrow"><span>Location</span><span class="v">'+ic('pin',13)+' '+esc(prof.addr)+'</span></div>'
     : svc.locationType==='customer'
     ? '<div class="f" style="margin:8px 0"><label>Your location</label><select class="inp" data-chg="bookloc">'+AREAS.map(a=>'<option'+(u.area===a.name?' selected':'')+'>'+a.name+'</option>').join('')+'</select></div>'
     : '<div class="f" style="margin:8px 0"><label>Where should this happen?</label><div class="seg"><button type="button" class="'+((b.loc||'studio')==='studio'?'on':'')+'" data-act="booklocopt" data-v="studio">Their studio</button><button type="button" class="'+(b.loc==='home'?'on':'')+'" data-act="booklocopt" data-v="home">Your location</button></div>'+(b.loc==='home'?'<div style="margin-top:8px"><select class="inp" data-chg="bookloc">'+AREAS.map(a=>'<option'+(u.area===a.name?' selected':'')+'>'+a.name+'</option>').join('')+'</select></div>':'')+'</div>'
  ) : '';
  return topbar({back:true,title:'Book a service',sub:prof.displayName,bell:u.id})
  +'<div class="main">'
  +'<div class="steps"><i class="on"></i><i class="'+(b.date?'on':'')+'"></i><i class="'+(b.start?'on':'')+'"></i></div>'
  +'<div class="card" style="margin-bottom:14px"><div class="f" style="margin-bottom:8px"><label>1 · Service</label>'
  +'<div class="row" style="flex-wrap:wrap;gap:7px">'+activeServicesOf(pid).map(s=>'<button class="chip'+(b.serviceId===s.id?' on':'')+'" data-act="picksvc" data-v="'+s.id+'">'+esc(s.name)+' · '+fmtRM(s.price)+'</button>').join('')+'</div></div>'
  +(svc?'<p class="small" style="color:var(--ink-2)">'+esc(svc.desc)+'</p><div class="row" style="margin-top:8px">'+locTypeBadge(svc.locationType)+'<span class="chip mono">'+ic('clock',12)+' '+svc.duration+' min</span><span class="chip mono">'+fmtRM(svc.price)+'</span></div>':'')
  +'</div>'
  +'<div class="card" style="margin-bottom:14px"><div class="f" style="margin-bottom:8px"><label>2 · Date & time</label></div><div class="daychips">'+dayChips+'</div>'+(b.date?'<div class="muted" style="margin-bottom:8px">'+fmtDateLong(b.date)+' · '+(svc?svc.duration+' min ':'')+'</div>':'')+slotsHtml+'</div>'
  +(b.date&&b.start&&svc
   ? '<div class="card" style="margin-bottom:14px"><div class="f" style="margin-bottom:6px"><label>3 · Details</label></div>'
     +'<div class="sumrow"><span>Service</span><span class="v">'+esc(svc.name)+'</span></div>'
     +'<div class="sumrow"><span>Date</span><span class="v">'+fmtDate(b.date)+'</span></div>'
     +'<div class="sumrow"><span>Time</span><span class="v">'+b.start+' – '+addMin(b.start,svc.duration)+'</span></div>'
     +locBlock
     +'<div class="f" style="margin:10px 0 4px"><label>Notes for the professional (optional)</label><textarea class="inp" placeholder="Allergies, preferences, references…" data-chg="booknotes" maxlength="200">'+esc(b.notes||'')+'</textarea></div>'
     +'<div class="total"><span class="muted" style="display:flex;align-items:center;gap:6px">'+ic('wallet',15)+' Payment</span><b>'+fmtRM(svc.price)+'</b></div>'
     +'<p class="note" style="margin-top:8px">Pay after the service. Mock payment — no card details collected.</p>'
     +'<button class="btn btn-p block" style="margin-top:12px" data-act="confirmbook">Confirm booking · '+fmtRM(svc.price)+'</button>'
    +'</div>'
   : '<p class="muted" style="text-align:center">Select a date, then a time slot to continue.</p>')
  +'</div>'+bnav(CUST_NAV);
}

/* ================= CUSTOMER BOOKINGS ================= */
function screenBookings(){
  const u=me();
  const tab=ui.bookingTab||'upcoming';
  const mine=db.bookings.filter(b=>b.customerId===u.id);
  const list=mine.filter(b=>{
    if(tab==='upcoming')return['pending','confirmed'].includes(b.status)&&b.date>=todayISO();
    if(tab==='completed')return['completed','no_show'].includes(b.status);
    return['cancelled','rejected'].includes(b.status);
  }).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)*(tab==='upcoming'?1:-1));
  const cards=list.map(b=>{
    const s=serviceOf(b.serviceId);const p=profileOf(b.providerId);const cu=userById(b.customerId);
    const reviewed=db.reviews.some(r=>r.bookingId===b.id);
    const acts=[];
    if(['pending','confirmed'].includes(b.status))acts.push('<button class="btn btn-d sm" data-act="cancelbook" data-id="'+b.id+'">Cancel</button>');
    if(b.status==='completed'&&!reviewed)acts.push('<button class="btn btn-p sm" data-act="review" data-id="'+b.id+'">Leave review</button>');
    if(b.status==='completed'&&reviewed)acts.push('<span class="pill completed" style="flex:1;justify-content:center">Reviewed ★ '+db.reviews.find(r=>r.bookingId===b.id).rating+'</span>');
    if(p)acts.push('<button class="btn btn-o sm" data-act="provider" data-id="'+p.id+'">View</button>');
    return '<div class="bcard" data-act="bookingdetail" data-id="'+b.id+'" style="cursor:pointer">'
    +'<div class="top">'+(p?avatarHTML(p.displayName,42):'')+'<div style="flex:1;min-width:0"><h4>'+esc(s?s.name:'Service')+'</h4><div class="sub">'+(p?esc(p.displayName):'')+'</div></div>'+statusPill(b.status)+'</div>'
    +'<div class="grid"><span>'+ic('cal',13)+' '+fmtDate(b.date)+'</span><span>'+ic('clock',13)+' '+(b.start||'—')+'</span><span>'+ic('wallet',13)+' '+fmtRM(b.price)+'</span><span>'+ic('pin',13)+' '+esc((b.location||'').split(',')[0])+'</span></div>'
    +'<div class="sub muted" style="font-size:11px">Ref '+b.ref+' · '+(b.payment||'')+'</div>'
    +'<div class="acts">'+acts.join('')+'</div></div>';
  }).join('');
  return topbar({brand:true,title:'My bookings',sub:u.name,bell:u.id})
  +'<div class="main">'
  +'<div class="seg" style="margin-bottom:16px"><button class="'+(tab==='upcoming'?'on':'')+'" data-act="btab" data-t="upcoming">Upcoming</button><button class="'+(tab==='completed'?'on':'')+'" data-act="btab" data-t="completed">Completed</button><button class="'+(tab==='cancelled'?'on':'')+'" data-act="btab" data-t="cancelled">Cancelled</button></div>'
  +(cards||'<div class="empty"><div class="big">🗓️</div><h4>Nothing here yet</h4><p>'+(tab==='upcoming'?'Your upcoming appointments will appear here. Find your next glow-up!':tab==='completed'?'Completed appointments will appear here.':'Cancelled or declined bookings will appear here.')+'</p>'+(tab==='upcoming'?'<button class="btn btn-p sm" data-act="nav" data-to="discover">Browse services</button>':'')+'</div>')
  +'</div>'+bnav(CUST_NAV);
}

/* ================= PROVIDER: DASHBOARD ================= */

  const today=mine.filter(b=>b.date===t0&&!['cancelled','rejected'].includes(b.status)).sort((a,b)=>a.start.localeCompare(b.start));
  const pending=mine.filter(b=>b.status==='pending'&&b.date>=t0).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
  const upcoming=mine.filter(b=>b.date>t0&&['pending','confirmed'].includes(b.status)).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
  const completed=mine.filter(b=>b.status==='completed').sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  const mon=t0.slice(0,7);
  const earnings=mine.filter(b=>['confirmed','completed'].includes(b.status)&&b.date.slice(0,7)===mon).reduce((a,b)=>a+b.price,0);
  const profileDone=p.displayName&&p.bio&&p.categoryIds.length>0;

  const checklist=(!profileDone||!svcDone||!avDone||!pfDone)?

   +'<li><span class="dot'+(profileDone?'':' no')+'">'+(profileDone?ic('check',12):ic('x',12))+'</span>Complete profile & categories<span class="sp"></span><button class="btn btn-o xs" data-act="nav" data-to="pstudio">Fix</button></li>'
   +'<li><span class="dot'+(svcDone?'':' no')+'">'+(svcDone?ic('check',12):ic('x',12))+'</span>Add at least one service with price<span class="sp"></span><button class="btn btn-o xs" data-act="nav" data-to="pserv">Fix</button></li>'
   +'<li><span class="dot'+(avDone?'':' no')+'">'+(avDone?ic('check',12):ic('x',12))+'</span>Set weekly availability<span class="sp"></span><button class="btn btn-o xs" data-act="nav" data-to="pavail">Fix</button></li>'
   +'<li><span class="dot'+(pfDone?'':' no')+'">'+(pfDone?ic('check',12):ic('x',12))+'</span>Upload portfolio photos<span class="sp"></span><button class="btn btn-o xs" data-act="nav" data-to="pstudio">Fix</button></li>'
   +'</ul></div>':'';
  const bkCard=(b,showActions)=>{
    const s=serviceOf(b.serviceId);const cu=userById(b.customerId);
    let acts='';
    if(showActions){
      if(b.status==='pending')acts='<button class="btn btn-p xs" data-act="pbook" data-id="'+b.id+'" data-a="accept">Accept</button><button class="btn btn-d xs" data-act="pbook" data-id="'+b.id+'" data-a="reject">Decline</button>';
      if(b.status==='confirmed')acts='<button class="btn btn-p xs" data-act="pbook" data-id="'+b.id+'" data-a="complete">Complete</button><button class="btn btn-o xs" data-act="pbook" data-id="'+b.id+'" data-a="noshow">No-show</button><button class="btn btn-d xs" data-act="pbook" data-id="'+b.id+'" data-a="cancel">Cancel</button>';
    }
    return '<div class="lrow" style="align-items:center"><div style="flex:1;min-width:0"><b>'+b.start+' · '+esc(s?s.name:'')+'</b><span>'+esc(cu?cu.name:'Customer')+' · '+fmtRM(b.price)+'</span></div>'+statusPill(b.status)+'</div>'+(acts?'<div class="row" style="gap:6px;margin:-4px 0 8px 0">'+acts+'</div>':'');
  };
  return topbar({brand:true,title:'Studio dashboard',sub:p.displayName+' · '+new Date().toLocaleDateString('en-MY',{weekday:'long',day:'numeric',month:'long'}),bell:u.id})
  +'<div class="main">'
  +checklist
  +'<div class="stats"><div class="stat"><b>'+today.length+'</b><small>Today</small></div><div class="stat"><b>'+pending.length+'</b><small>Pending</small></div><div class="stat"><b style="font-size:13px;padding-top:3px">'+fmtRM(earnings)+'</b><small>This month</small></div><div class="stat"><b>★ '+p.avg.toFixed(1)+'</b><small>Rating</small></div></div>'
  +(pending.length

  +'<div class="sect"><div class="sect-h"><h3>Recently completed</h3></div><div class="card">'+(completed.map(b=>'<div class="lrow" style="align-items:center"><div style="flex:1;min-width:0"><b>'+fmtDate(b.date)+'</b><span>'+esc((serviceOf(b.serviceId)||{}).name||'')+' · '+esc((userById(b.customerId)||{}).name||'')+'</span></div><span class="muted">'+fmtRM(b.price)+'</span></div>').join('')||'<div class="muted" style="padding:6px 0">No completed appointments yet.</div>')+'</div></div>'
  +'</div>'+bnav(PROV_NAV);

/* ================= PROVIDER: CALENDAR ================= */
function screenPcal(){
  const p=myProfile();if(!p)return screenAuth();
  const weekOffset=ui.providerWeek||0;
  const t0=todayISO();
  const monday=(()=>{const d=new Date();const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day+weekOffset*7);return d})();
  const days=Array.from({length:7},(_,i)=>addDays(monday,i));
  const body=days.map(d=>{
    const iso=dISO(d);
    const isToday=iso===t0;
    const bs=db.bookings.filter(b=>b.providerId===p.id&&b.date===iso).sort((a,b)=>a.start.localeCompare(b.start));
    const bl=db.blocked.filter(k=>k.providerId===p.id&&k.start.slice(0,10)===iso);
    const am=availMap(p.id);const w=am[d.getDay()];
    const rows=[];
    bl.forEach(k=>rows.push('<div class="crow blocked"><span class="t">'+k.start.slice(11,16)+'</span><span class="x">Blocked · '+esc(k.reason)+'</span><button class="btn btn-o xs" data-act="unblock" data-id="'+k.id+'">Remove</button></div>'));
    bs.forEach(b=>{
      const s=serviceOf(b.serviceId);const cu=userById(b.customerId);
      rows.push('<div class="crow"><span class="t">'+b.start+'</span><span class="x">'+esc(s?s.name:'')+' — '+esc(cu?cu.name:'')+'</span>'+statusPill(b.status)+'</div>');
    });
    return '<div class="cal-day"><div class="h'+(isToday?' today':'')+'">'+parseISO(iso).toLocaleDateString('en-MY',{weekday:'long'})+' '+d.getDate()+(isToday?' · Today':'')+'<small>'+(w?w.start+'–'+w.end:'Closed')+'</small></div>'
    +(rows.length?rows.join(''):'<div class="muted" style="padding:10px 12px">'+(w?'No bookings — free to take requests.':'Closed this day.')+'</div>')+'</div>';
  }).join('');
  const label=days[0].toLocaleDateString('en-MY',{day:'numeric',month:'short'})+' – '+days[6].toLocaleDateString('en-MY',{day:'numeric',month:'short'});
  return topbar({back:route.prev,title:'Calendar',sub:label,bell:me().id})
  +'<div class="main">'
  +'<div class="row" style="margin-bottom:14px"><button class="btn btn-o sm" data-act="calweek" data-v="-1">'+ic('back',15)+'</button><span style="flex:1;text-align:center;font-weight:700;color:var(--plum);font-size:13.5px">'+label+'</span><button class="btn btn-o sm" data-act="calweek" data-v="1">'+ic('chevR',15)+'</button></div>'
  +body
  +'<div class="legend"><span><i style="background:var(--green-bg);border:1px solid var(--green)"></i>Booked</span><span><i style="background:repeating-linear-gradient(45deg,#FBF3F0,#FBF3F0 3px,#F0DDD5 3px,#F0DDD5 6px)"></i>Blocked</span><span><i style="background:var(--amber-bg);border:1px solid var(--amber)"></i>Pending</span></div>'
  +'</div>'+bnav(PROV_NAV);
}

    +'<div class="note">Funnel (demo data): '+bk.length+' bookings → '+bk.filter(b=>b.status!=='pending').length+' decided → '+doneN+' completed. Acceptance rate: '+Math.round(bk.filter(b=>['confirmed','completed','no_show'].includes(b.status)).length/Math.max(1,bk.length-bk.filter(b=>b.status==='pending').length)*100)+'%.</div>';
  }
  if(tab==='providers'){

     +(p.verification!=='verified'?'<button class="btn btn-p xs" data-act="adminverify" data-id="'+p.id+'">Verify</button>':'')
     +(p.verification!=='suspended'?'<button class="btn btn-d xs" data-act="adminsuspend" data-id="'+p.id+'">Suspend</button>':'<button class="btn btn-o xs" data-act="adminreact" data-id="'+p.id+'">Reactivate</button>')+'</div>').join('')+'</div>'
    +'<p class="note">Verified badge is granted manually here. Suspended providers hide from customer booking but stay visible with a warning.</p>';
  }
  if(tab==='categories'){
    body='<div class="card flush">'+db.categories.map(c=>'<div class="lrow" style="align-items:center"><span class="ic" style="font-size:17px;background:var(--brand-50);width:38px;height:38px;border-radius:12px;display:grid;place-items:center">'+c.icon+'</span><div class="t"><b>'+esc(c.name)+'</b><span>'+esc(c.desc)+'</span></div><span class="muted" style="font-size:11px">'+db.profiles.filter(p=>p.categoryIds.includes(c.id)).length+' pros</span><label class="sw"><input type="checkbox" '+(c.active?'checked':'')+' data-chg="catactive" data-id="'+c.id+'"><i></i></label></div>').join('')+'</div>';

const ROUTES={
 splash:()=>screenSplash(),
 auth:()=>screenAuth(),
 home:()=>screenHome(),
 discover:()=>screenDiscover(),
 provider:(p)=>screenProvider(p),
 book:(p)=>screenBook(p),
 bookings:()=>screenBookings(),
 review:(p)=>screenReview(p),

let screenSplashTimer=null;
function screenSplash(){
  return '<div class="splash"><img src="'+LOGO_FULL+'" alt="Glamoora"><div class="tag">Discover · Book · Glow</div><div class="ld"><i></i><i></i><i></i></div></div>';
}
function navigate(name,params){
  route={name,params:params||{},prev:route.name};
  if(name==='provider')ui.catTab='services';
  if(name==='book')ui.booking=ui.booking&&ui.booking.providerId===params.id?ui.booking:{providerId:params.id,serviceId:params.svc||null,date:null,start:null,notes:'',loc:null};
  if(name==='bookings')ui.bookingTab=ui.bookingTab||'upcoming';
  render();
}
function homeFor(u){return u.role==='provider'?'pdash':u.role==='admin'?'admin':'home'}
function render(){
  const u=me();
  let name=route.name;
  if(!u&&name!=='auth'&&name!=='splash')name='auth';
  if(u&&name==='auth')name=homeFor(u);
  let html;
  try{html=ROUTES[name](route.params)}catch(err){console.error(err);html='<div class="main"><div class="empty"><div class="big">😵</div><h4>Something broke</h4><p>'+esc(err.message)+'</p><button class="btn btn-o sm" data-act="reload">Reload app</button></div></div>'}
  if(ui.sheet)html+=(typeof ui.sheet==='function'?ui.sheet():ui.sheet);
  if(ui.toast)html+='<div class="toast">'+esc(ui.toast.msg)+'</div>';
  const app=$('#app');
  const sc=app.querySelector('.main');const st=sc?window.scrollY:0;
  app.innerHTML=html;
  window.scrollTo(0,st);
}

/* ================= FORMS ================= */
function fail(formEl,msg){
  const box=formEl.querySelector('.errbox');if(box){box.textContent=msg;box.style.display='block'}
}
const FORMS={
 login:(fd,f)=>{
   const email=String(fd.get('email')||'').trim().toLowerCase();
   const pass=String(fd.get('pass')||'');
   const u=db.users.find(x=>x.email.toLowerCase()===email&&x.password===pass);
   if(!u){fail(f,'Invalid email or password. Try a demo account below.');return}
   db.session=u.id;saveDB();
   toast('Welcome back, '+u.name.split(' ')[0]+' ✦');
   navigate(homeFor(u));
 },
 reg:(fd,f)=>{
   const role=ui.regRole||'customer';
   const name=String(fd.get('name')||'').trim();
   const email=String(fd.get('email')||'').trim().toLowerCase();
   const phone=String(fd.get('phone')||'').trim();
   const pass=String(fd.get('pass')||'');
   if(name.length<2){fail(f,'Please enter your name.');return}
   if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){fail(f,'Please enter a valid email.');return}
   if(pass.length<6){fail(f,'Password must be at least 6 characters.');return}
   if(db.users.some(u=>u.email.toLowerCase()===email)){fail(f,'An account with this email already exists.');return}
   const u={id:uid('u'),role,email,password:pass,name,phone,area:AREAS[0].name,lat:AREAS[0].lat,lng:AREAS[0].lng,createdAt:Date.now()};
   db.users.push(u);
   if(role==='provider'){
     const biz=String(fd.get('biz')||'').trim()||name+' Studio';
     const bio=String(fd.get('bio')||'').trim();
     const area=String(fd.get('area')||AREAS[0].name);
     const a=AREAS.find(x=>x.name===area)||AREAS[0];
     const cats=fd.getAll('cats');
     u.area=a.name;u.lat=a.lat;u.lng=a.lng;
     db.profiles.push({id:uid('p'),userId:u.id,displayName:biz,bio:bio||'New on Glamoora — check out my work!',addr:a.name+' area, Kuala Lumpur',lat:a.lat,lng:a.lng,radiusKm:10,verification:'unverified',avg:0,reviewCount:0,categoryIds:cats.length?cats:['c1'],phone:phone||'',extra:{}});
   }
   db.session=u.id;saveDB();
   toast(role==='provider'?'Studio account created — let\'s set you up!':'Account created. Welcome to Glamoora ✦');
   navigate(homeFor(u));
 },
 newsvc:(fd,f)=>{
   const p=myProfile();
   const name=String(fd.get('name')||'').trim();
   const price=parseFloat(fd.get('price'));
   if(name.length<2||!(price>0)){fail(f,'Give the service a name and a price.');return}
   db.services.push({id:uid('s'),providerId:p.id,categoryId:String(fd.get('cat')||p.categoryIds[0]||'c1'),name,desc:String(fd.get('desc')||'').trim(),price,duration:parseInt(fd.get('dur')||60),locationType:String(fd.get('loc')||'provider'),active:true});
   saveDB();ui.addSvc=false;toast('Service added — customers can now book it');render();
 },
 editsvc:(fd,f)=>{
   const s=serviceOf(ui.editSvc);if(!s)return;
   s.name=String(fd.get('name')||s.name).trim();
   s.price=parseFloat(fd.get('price'))||s.price;
   s.duration=parseInt(fd.get('dur')||s.duration);
   s.locationType=String(fd.get('loc')||s.locationType);
   s.categoryId=String(fd.get('cat')||s.categoryId);
   s.desc=String(fd.get('desc')||'').trim();
   saveDB();ui.editSvc=null;toast('Service updated');render();
 },
 newblock:(fd,f)=>{
   const p=myProfile();
   const date=String(fd.get('date')||'');
   const s=String(fd.get('s')||'10:00'),e=String(fd.get('e')||'12:00');
   const reason=String(fd.get('reason')||'').trim();
   if(!date||timeToMin(s)>=timeToMin(e)){fail(f,'Pick a date with an end after the start time.');return}
   const fullS=date+' '+s,fullE=date+' '+e;
   // prevent blocking an existing booking
   const conflict=db.bookings.some(b=>b.providerId===p.id&&b.date===date&&!['cancelled','rejected'].includes(b.status)&&overlap(timeToMin(s),timeToMin(e),timeToMin(b.start),timeToMin(b.end)));
   if(conflict){fail(f,'That time overlaps an existing booking — it stays reserved.');return}
   db.blocked.push({id:uid('k'),providerId:p.id,start:fullS,end:fullE,reason:reason||'Blocked'});
   saveDB();toast('Time blocked');render();
 },
 prof:(fd,f)=>{
   const p=myProfile();const u=me();
   p.displayName=String(fd.get('biz')||p.displayName).trim();
   p.bio=String(fd.get('bio')||'').trim();
   p.phone=String(fd.get('phone')||'').trim();
   p.radiusKm=parseInt(fd.get('radius')||p.radiusKm);
   const area=String(fd.get('area')||'');
   const a=AREAS.find(x=>x.name===area)||AREAS[0];
   p.addr=a.name+' area, Kuala Lumpur';p.lat=a.lat;p.lng=a.lng;
   u.area=a.name;u.lat=a.lat;u.lng=a.lng;
   const cats=fd.getAll('cats');
   if(cats.length)p.categoryIds=cats;
   saveDB();toast('Profile saved');render();
 },
 newport:(fd,f)=>{
   const p=myProfile();
   const svcId=String(fd.get('svc')||'');
   const caption=String(fd.get('caption')||'').trim();
   if(!svcId){fail(f,'Add a service first, then link it to a portfolio item.');return}
   const s=serviceOf(svcId);
   const artKey={c1:'lash',c2:'brow',c3:'massage',c4:'nail',c5:'saree',c6:'wax',c7:'hair'}[s.categoryId]||'spark';
   db.portfolio.push({id:uid('pf'),providerId:p.id,serviceId:svcId,art:artKey,grad:'g'+(Math.floor(Math.random()*6)+1),caption});
   saveDB();toast('Portfolio item added');render();
 }
};

/* ================= BOOKING SUCCESS (pseudo route) ================= */
const EXTRA_ROUTES={
 booksuccess:(p)=>{
   const b=db.bookings.find(x=>x.id===p.id);
   if(!b||b.customerId!==me().id)return screenBookings();
   const s=serviceOf(b.serviceId);const prof=profileOf(b.providerId);
   return topbar({back:true,title:'Booking sent',sub:prof.displayName,bell:me().id})
   +'<div class="main"><div class="success">'
   +'<div class="ring">'+ic('check',40)+'</div>'
   +'<h2>Booking request sent!</h2>'
   +'<p>'+esc(s?s.name:'')+' · '+fmtDateLong(b.date)+', '+b.start+' – '+(b.end||'')+'<br>'+esc(b.location)+'</p>'
   +'<div class="reftag">'+b.ref+'</div>'
   +'<div class="card" style="margin-top:16px;width:100%;max-width:300px;text-align:left"><div class="sumrow"><span>Status</span>'+statusPill(b.status)+'</div><div class="sumrow"><span>Payment</span><b>'+fmtRM(b.price)+' · after service</b></div><div class="sumrow"><span>Cancel</span><b class="small">Free, anytime before</b></div></div>'
   +'<p class="note" style="width:100%;max-width:300px">'+esc(prof.displayName)+' will confirm shortly. Track everything in My bookings.</p>'
   +'<div style="display:flex;gap:9px;width:100%;max-width:300px;margin-top:16px"><button class="btn btn-p sm" style="flex:1" data-act="nav" data-to="bookings">My bookings</button><button class="btn btn-o sm" style="flex:1" data-act="provider" data-id="'+b.providerId+'">View studio</button></div>'
   +'</div></div>'+bnav(CUST_NAV);
 }
};
Object.assign(ROUTES,EXTRA_ROUTES);

/* ================= BOOT ================= */
function splashThen(){
  clearTimeout(screenSplashTimer);
  screenSplashTimer=setTimeout(()=>{
    const u=me();
    navigate(u?homeFor(u):'auth');
  },1500);
}
function bindEvents(){
  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-act]');if(!el)return;
    const act=el.dataset.act;
    if(el.dataset.stop)e.stopPropagation();
    if(ACT[act])ACT[act](el.dataset,e);
  });
  document.addEventListener('submit',e=>{
    const f=e.target.closest('form[data-form]');if(!f)return;
    e.preventDefault();
    if(FORMS[f.dataset.form])FORMS[f.dataset.form](new FormData(f),f);
  });
  document.addEventListener('change',e=>{
    const el=e.target.closest('[data-chg]');if(!el)return;
    if(CHG[el.dataset.chg])CHG[el.dataset.chg](el);
  });
  // Enter key in search fields
  document.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      if(e.target.id==='homeq'){e.preventDefault();ACT.homesearch()}
      if(e.target.id==='dq'){e.preventDefault();render()}
    }
  });
}
initDB();
bindEvents();
if(!me()){route={name:'splash',params:{}};splashThen()}
else{route={name:homeFor(me()),params:{}}}
render();
</script>
</body>
</html>
